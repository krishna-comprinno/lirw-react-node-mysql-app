
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - npm install --prefix frontend

  pre_build:
    commands:
      - echo "Configuring frontend API URL"
      - echo "VITE_API_URL=/api" > frontend/.env.production

  build:
    commands:
      - npm run build --prefix frontend

  post_build:
    commands:
      - echo "Frontend build complete"

artifacts:
  base-directory: frontend
  files:
    - appspec.yml
    - scripts/**/*
    - nginx/**/*
    - dist/**/*
  discard-paths: no
